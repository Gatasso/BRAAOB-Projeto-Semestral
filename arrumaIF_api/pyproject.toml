[project]
name = "arrumaif-api"
version = "0.1.0"
description = "API para o projeto ArrumaIF"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "bcrypt==5.0.0",
    "blinker==1.9.0",
    "click==8.4.1",
    "Flask==3.1.3",
    "flask-cors==6.0.2",
    "Flask-Migrate==4.0.7",
    "Flask-SQLAlchemy==3.1.1",
    "greenlet==3.5.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "Mako==1.3.12",
    "MarkupSafe==3.0.3",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.50",
    "typing_extensions==4.15.0",
    "Werkzeug==3.1.8"
]

[tool.vercel]
entrypoint = "arrumaIF_api.main:app"